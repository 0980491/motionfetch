[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motionfetch"
version = "0.1.0"
description = "Turn videos and images into terminal animations, and run them beside fastfetch"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0980491" }]
requires-python = ">=3.9"
dependencies = ["pillow>=9", "rich>=12", "numpy>=1.24"]
keywords = ["fastfetch", "ascii-art", "terminal", "animation", "ansi"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/0980491/motionfetch"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
motionfetch = "motionfetch.cli:main"
motionfetch-gui = "motionfetch.gui:main"

[tool.setuptools]
packages = ["motionfetch"]

[tool.setuptools.package-data]
motionfetch = ["assets/*.txt"]
